
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link.Salve</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#06111f;color:#fff;
 font-family:Arial,sans-serif;padding:18px;
}
.container{max-width:600px;margin:auto}
header{
 text-align:center;padding:25px 10px;
 background:linear-gradient(135deg,#063b77,#0878e8);
 border-radius:18px;margin-bottom:22px;
 box-shadow:0 5px 25px #0878e844;
}
.logo{font-size:35px}
h1{margin:8px 0;font-size:28px}
header p{margin:0;color:#d6eaff}
.card{
 background:#0d1e32;border:1px solid #183b60;
 padding:17px;border-radius:15px;margin-bottom:18px;
}
h2{font-size:18px;margin:0 0 14px}
label{display:block;margin:12px 0 7px;color:#b9d8ff}
input,textarea{
 width:100%;padding:13px;border-radius:10px;
 border:1px solid #24517c;background:#071629;
 color:white;font-size:15px;outline:none;
}
textarea{height:110px;resize:vertical}
input:focus,textarea:focus{border-color:#1689ff}
button{
 border:0;border-radius:10px;padding:12px;
 font-weight:bold;cursor:pointer;
}
.primary{
 background:#0878e8;color:white;width:100%;margin-top:12px;
}
.primary:active{background:#0058b8}
.link-card{
 background:#0d1e32;border:1px solid #1b4168;
 border-radius:13px;padding:15px;margin-bottom:12px;
 overflow-wrap:anywhere;
}
.link-title{font-size:17px;font-weight:bold;margin-bottom:8px}
.link-url{font-size:12px;color:#9db8d7;margin-bottom:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-width:75px}
.open{background:#0878e8;color:white}
.edit{background:#163c60;color:#d9ecff}
.delete{background:#572333;color:#ffb9c5}
.empty{text-align:center;color:#8ca6c4;padding:25px 5px}
.count{color:#9fcaff;font-size:13px;margin-bottom:12px}
footer{text-align:center;color:#607e9f;font-size:12px;padding:20px}
</style>
</head>
<body>
<div class="container">

<header>
 <div class="logo">🔗</div>
 <h1>Link.Salve</h1>
 <p>Seu espaço para guardar links favoritos</p>
</header>

<div class="card">
 <h2>＋ Adicionar link</h2>

 <label for="nome">Nome do link</label>
 <input id="nome" placeholder="Ex.: Meu site">

 <label for="url">Endereço do site</label>
 <input id="url" placeholder="https://exemplo.com"
        inputmode="url">

 <button class="primary" id="salvar">💾 SALVAR LINK</button>
 <button class="primary" id="cancelar"
 style="display:none;background:#29425c">
 Cancelar edição
 </button>
</div>

<div class="card">
 <h2>📚 Meus links</h2>
 <div class="count" id="contador">0 links salvos</div>
 <div id="lista"></div>
</div>

<footer>Link.Salve • Seus links em um só lugar 💙</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const CHAVE = "linkSalveAzul_v1";
let links = [];
let editando = -1;

try {
 const dados = JSON.parse(localStorage.getItem(CHAVE) || "[]");
 if(Array.isArray(dados)) {
  links = dados.filter(x =>
   x && typeof x.nome === "string" &&
   typeof x.url === "string"
  );
 }
} catch(e) {}

function validarURL(valor) {
 try {
  const u = new URL(valor);
  return u.protocol === "https:" || u.protocol === "http:";
 } catch(e) {
  return false;
 }
}

function guardar() {
 try {
  localStorage.setItem(CHAVE, JSON.stringify(links));
  mostrar();
  return true;
 } catch(e) {
  alert("Não foi possível salvar os dados neste navegador.");
  return false;
 }
}

function limparFormulario() {
 $("nome").value = "";
 $("url").value = "";
 editando = -1;
 $("salvar").textContent = "💾 SALVAR LINK";
 $("cancelar").style.display = "none";
}

$("salvar").addEventListener("click", () => {
 const nome = $("nome").value.trim();
 let url = $("url").value.trim();

 if(!nome || !url) {
  alert("Preencha o nome e o endereço!");
  return;
 }

 if(!/^https?:\/\//i.test(url)) {
  url = "https://" + url;
 }

 if(!validarURL(url)) {
  alert("Digite um endereço válido, como https://google.com");
  return;
 }

 if(editando === -1) {
  links.unshift({nome,url});
 } else {
  links[editando] = {nome,url};
 }

 if(guardar()) limparFormulario();
});

$("cancelar").addEventListener("click", limparFormulario);

function mostrar() {
 const lista = $("lista");
 lista.replaceChildren();
 $("contador").textContent =
  links.length + (links.length === 1 ? " link salvo" : " links salvos");

 if(!links.length) {
  const vazio = document.createElement("div");
  vazio.className = "empty";
  vazio.textContent = "🔎 Nenhum link salvo ainda.";
  lista.appendChild(vazio);
  return;
 }

 links.forEach((item,i) => {
  const caixa = document.createElement("div");
  caixa.className = "link-card";

  const titulo = document.createElement("div");
  titulo.className = "link-title";
  titulo.textContent = "🔗 " + item.nome;

  const endereco = document.createElement("div");
  endereco.className = "link-url";
  endereco.textContent = item.url;

  const acoes = document.createElement("div");
  acoes.className = "actions";

  const abrir = document.createElement("button");
  abrir.className = "open";
  abrir.textContent = "ABRIR";
  abrir.onclick = () => {
   if(validarURL(item.url)) window.open(item.url,"_blank","noopener");
  };

  const editar = document.createElement("button");
  editar.className = "edit";
  editar.textContent = "EDITAR";
  editar.onclick = () => {
   $("nome").value = item.nome;
   $("url").value = item.url;
   editando = i;
   $("salvar").textContent = "💾 SALVAR ALTERAÇÕES";
   $("cancelar").style.display = "block";
   window.scrollTo({top:0,behavior:"smooth"});
  };

  const apagar = document.createElement("button");
  apagar.className = "delete";
  apagar.textContent = "APAGAR";
  apagar.onclick = () => {
   if(confirm("Apagar o link " + item.nome + "?")) {
    links.splice(i,1);
    if(editando === i) limparFormulario();
    else if(editando > i) editando--;
    guardar();
   }
  };

  acoes.append(abrir,editar,apagar);
  caixa.append(titulo,endereco,acoes);
  lista.appendChild(caixa);
 });
}

mostrar();
</script>
</body>
</html>
